root = "."
tmp_dir = "tmp"

[build]
  entrypoint = "main.go"
  
  # This tells Air how to compile your CSS and Go code
  cmd = "tailwindcss -i ./static/css/input.css -o ./static/css/style.css && go build -o ./tmp/main ."
  
  bin = "tmp/main"
  full_bin = "APP_ENV=dev ./tmp/main"

  include_ext = ["go", "tpl", "tmpl", "html", "css", "js", "env"]
  exclude_dir = ["assets", "tmp", "vendor", "static", "node_modules"]
  include_file = ["static/css/input.css", "tailwind.config.js"]

  delay = 1000
  stop_on_error = true
  send_interrupt = true
  kill_delay = 500 

[screen]
  clear_on_rebuild = true