services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Database
      - DB_USER=user
      - DB_PASSWORD=password
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=social_media_db
      - DB_URL=postgres://user:password@db:5432/social_media_db?sslmode=disable
      # Redis (Matching your pkg/platform/redis.go logic)
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - REDIS_ADDR=cache:6379
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  db:
    image: postgres:alpine
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=social_media_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d social_media_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  cache:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: